{% load blog_tags %}
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <link href="{% static "css/blog.css" %}" rel="stylesheet">
</head>
<body>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
    <div class="sidebar">
        <h2>My Blog</h2>
        <p>This my blog.
            I've been writing {% total_posts %} posts so far.
        </p>
    </div>
</body>
